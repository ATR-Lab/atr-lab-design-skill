<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- ATR blueprint grid: minor 24px @0.55, major 120px @1.0, stroke 1px #D6DEE8 on #FFFFFF; tile 120x120 -->
  <defs>
    <pattern id="grid" patternUnits="userSpaceOnUse" width="120" height="120">
      <path d="M24.5,0 V120 M0,24.5 H120 M48.5,0 V120 M0,48.5 H120 M72.5,0 V120 M0,72.5 H120 M96.5,0 V120 M0,96.5 H120" stroke="#D6DEE8" stroke-opacity="0.55" stroke-width="1" fill="none"/>
      <path d="M0.5,0 V120 M0,0.5 H120" stroke="#D6DEE8" stroke-opacity="1.0" stroke-width="1" fill="none"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="#FFFFFF"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
</svg>
