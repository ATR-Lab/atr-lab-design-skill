<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- ATR blueprint grid: minor 24px @0.14, major 120px @0.3, stroke 1px #2C8ECD on #00295F; tile 120x120 -->
  <defs>
    <pattern id="grid" patternUnits="userSpaceOnUse" width="120" height="120">
      <path d="M24.5,0 V120 M0,24.5 H120 M48.5,0 V120 M0,48.5 H120 M72.5,0 V120 M0,72.5 H120 M96.5,0 V120 M0,96.5 H120" stroke="#2C8ECD" stroke-opacity="0.14" stroke-width="1" fill="none"/>
      <path d="M0.5,0 V120 M0,0.5 H120" stroke="#2C8ECD" stroke-opacity="0.3" stroke-width="1" fill="none"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="#00295F"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
</svg>
